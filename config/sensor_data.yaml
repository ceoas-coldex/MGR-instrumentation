# This file sets up the dictionary for data management / live plotting buffer.
#
# IMPORTANT - the dictionary keys ("Time (epoch)" and "Data") must exist and be spelled correctly. If you want to eliminate all
#   the data channels from a sensor, just comment out the whole sensor.
#
# ALSO IMPORTANT - if you've already taken some data in a day and then want to change what sensors are active here, go into the
#   data_saving.yaml config file and add a data suffix. This will create a new file with an updated header, so you don't run
#   the risk of saving data to the incorrect header.
---
Picarro Gas:
  Time (epoch):
  Data:
    CavityPressure:
      Plot: N
    OutletValve:
      Plot: N
    CO:
      Plot: Y
    CO2:
      Plot: Y
    CH4:
      Plot: Y
    H2O:
      Plot:  Y
Picarro Water:
  Time (epoch):
  Data:
    CavityPressure:
      Plot: N
    OutletValve:
      Plot: N
    H2O:
      Plot: Y
    Delta_18:
      Plot: Y
    Delta_D:
      Plot: Y
    ValcoPosition:
      Plot: N
Laser Distance Sensor:
  Time (epoch):
  Data:
    Distance (cm):
      Plot: Y
    Temperature (C):
      Plot: Y
Abakus Particle Counter:
  Time (epoch):
  Data:
    Total Counts:
      Plot: Y
    Bins:
      Plot: N
    Counts/Bin:
      Plot: N
    Incremental Counts:
      Plot: Y
Flowmeter:
  Time (epoch):
  Data:
    SLI2000 (uL/min):
      Plot: Y
    SLS1500 (mL/min):
      Plot: Y
  Other:
    Samples Per Query: 15
Bronkhorst Pressure:
  Time (epoch):
  Data:
    Setpoint (mbar a):
      Plot: N
    Measurement (%):
      Plot: N
    Measurement (mbar a):
      Plot: Y
    Temperature (C):
      Plot: Y
  Control:
    Pressure (mbar):
Melthead:
  Time (epoch):
  Data:
    Temperature (Not Yet Integrated):
      Plot: N
  Control:
    Temperature (C):